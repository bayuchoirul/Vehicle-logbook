<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vehicle Logbook — Masuk</title>
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center px-4">
  <div class="w-full max-w-sm rounded-2xl border border-slate-800 bg-slate-900/80 p-6 space-y-5 shadow-2xl">
    <div>
      <h1 class="text-xl font-bold text-white">Vehicle Logbook</h1>
      <p class="mt-1 text-xs text-slate-400">Masuk dengan akun Supabase Anda untuk mengakses catatan BBM & servis.</p>
    </div>

    <form id="form-auth" class="space-y-4">
      <div class="space-y-1">
        <label for="email" class="block text-xs font-medium text-slate-300">Email</label>
        <input id="email" name="email" type="email" required class="w-full rounded-xl border border-slate-800 bg-slate-950 px-3.5 py-2.5 text-sm text-white focus:border-pink-500 focus:outline-none" />
      </div>
      <div class="space-y-1">
        <label for="password" class="block text-xs font-medium text-slate-300">Password</label>
        <input id="password" name="password" type="password" required class="w-full rounded-xl border border-slate-800 bg-slate-950 px-3.5 py-2.5 text-sm text-white focus:border-pink-500 focus:outline-none" />
      </div>
      <p id="auth-status" class="text-xs text-slate-400"></p>
      <div class="grid grid-cols-2 gap-2.5 pt-1">
        <button type="submit" class="rounded-xl bg-pink-600 py-2.5 text-sm font-semibold text-white hover:bg-pink-500 transition">Masuk</button>
        <button type="button" id="btn-signup" class="rounded-xl border border-slate-700 py-2.5 text-sm font-medium text-slate-300 hover:bg-slate-800 transition">Daftar</button>
      </div>
    </form>
  </div>
  <script type="module" src="/js/controllers/login-controller.js"></script>
</body>
</html>
