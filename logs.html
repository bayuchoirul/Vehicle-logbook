<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Riwayat Logbook — Vehicle Logbook</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <header class="sticky top-0 z-30 border-b border-slate-200 bg-white">
      <div class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-3 px-4 py-3 sm:px-6">
        <div class="flex items-center gap-3">
          <a href="./index.html" class="text-base font-bold text-slate-900">Vehicle Logbook</a>
          <nav class="flex items-center gap-1 rounded-lg bg-slate-100 p-1 text-xs font-semibold">
            <a href="./index.html" class="rounded-md px-2.5 py-1 text-slate-600 hover:text-slate-900">
              Dashboard
            </a>
            <a href="./logs.html" class="rounded-md bg-white px-2.5 py-1 text-slate-900 shadow-xs">
              Riwayat
            </a>
          </nav>
        </div>

        <div class="flex items-center gap-2">
          <span id="user-email" class="hidden text-xs text-slate-500 sm:inline"></span>
          <button
            id="btn-signout"
            type="button"
            class="rounded-lg border border-slate-200 px-3 py-1.5 text-xs font-semibold text-slate-700 hover:bg-slate-100"
          >
            Keluar
          </button>
        </div>
      </div>
    </header>

    <main class="mx-auto max-w-5xl space-y-4 px-4 py-6 sm:px-6">
      <!-- Filter & Search Controls -->
      <section class="flex flex-wrap items-center justify-between gap-3 rounded-2xl border border-slate-200 bg-white p-4 shadow-xs">
        <div class="flex flex-wrap items-center gap-2">
          <select
            id="vehicle-selector"
            aria-label="Pilih Kendaraan"
            class="rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm font-semibold text-slate-900"
          ></select>

          <div class="flex items-center gap-1 rounded-xl border border-slate-200 bg-slate-50 p-1 text-xs font-semibold">
            <button
              type="button"
              data-filter-type="all"
              class="rounded-lg bg-slate-900 px-3 py-1.5 text-white"
            >
              Semua
            </button>
            <button
              type="button"
              data-filter-type="fuel"
              class="rounded-lg bg-white px-3 py-1.5 text-slate-700"
            >
              BBM
            </button>
            <button
              type="button"
              data-filter-type="maintenance"
              class="rounded-lg bg-white px-3 py-1.5 text-slate-700"
            >
              Servis
            </button>
          </div>
        </div>

        <div class="flex flex-wrap items-center gap-2">
          <input
            id="logbook-search"
            type="search"
            placeholder="Cari SPBU, oli, catatan..."
            class="rounded-xl border border-slate-300 px-3 py-2 text-xs"
          />
          <button
            id="btn-export-csv"
            type="button"
            class="rounded-xl border border-slate-200 px-3 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-100"
          >
            Ekspor CSV
          </button>
        </div>
      </section>

      <!-- Log Table -->
      <section class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-xs">
        <div class="flex items-center justify-between border-b border-slate-100 px-4 py-3">
          <h1 class="text-base font-bold text-slate-900">Seluruh Catatan Kendaraan</h1>
          <span id="logbook-count" class="text-xs font-medium text-slate-500">0 catatan</span>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full border-collapse text-left">
            <thead>
              <tr class="border-b border-slate-200 bg-slate-50 text-xs font-semibold text-slate-600">
                <th class="px-4 py-3">Tanggal &amp; Odo</th>
                <th class="px-4 py-3">Tipe</th>
                <th class="px-4 py-3">Deskripsi</th>
                <th class="px-4 py-3 text-right">Biaya</th>
                <th class="px-4 py-3 text-right">Aksi</th>
              </tr>
            </thead>
            <tbody id="logbook-table-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script type="module" src="./js/controllers/logbook-controller.js"></script>
  </body>
</html>
