<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Riwayat Logbook — Vehicle Logbook</title>
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="stylesheet" href="./css/styles.css" />
  <script type="module" src="./js/config.js"></script>
  <script type="module" src="./js/controllers/logbook-controller.js"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
  <header class="sticky top-0 z-30 border-b border-slate-200 bg-white/95 backdrop-blur">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3.5 sm:px-6">
      <div class="flex items-center gap-6">
        <a href="./" class="text-base font-bold tracking-tight text-slate-900">Vehicle Logbook</a>
        <nav class="flex items-center gap-1 rounded-xl bg-slate-100 p-1 text-xs font-semibold">
          <a href="./" class="rounded-lg px-3 py-1.5 text-slate-600 hover:text-slate-900">Dashboard</a>
          <a href="./logs" class="rounded-lg bg-white px-3 py-1.5 text-slate-900 shadow-xs">Riwayat</a>
        </nav>
      </div>
      <div class="flex items-center gap-3">
        <span id="user-email" class="hidden text-xs text-slate-500 sm:inline"></span>
        <button id="btn-signout" type="button" class="rounded-xl border border-slate-200 px-3 py-1.5 text-xs font-semibold text-slate-700 hover:bg-slate-100">
          Keluar
        </button>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-6xl space-y-6 px-4 py-6 sm:px-6">
    <!-- Filters & Actions -->
    <section class="flex flex-col justify-between gap-4 rounded-2xl border border-slate-200 bg-white p-4 shadow-xs lg:flex-row lg:items-center">
      <div class="flex flex-wrap items-center gap-2.5">
        <select id="vehicle-selector" aria-label="Pilih Kendaraan" class="rounded-xl border border-slate-300 bg-white px-3.5 py-2 text-sm font-semibold text-slate-900">
          <option value="">Memuat kendaraan...</option>
        </select>

        <div class="inline-flex rounded-xl border border-slate-200 bg-slate-50 p-1 text-xs font-semibold">
          <button type="button" data-filter-type="all" class="rounded-lg bg-slate-900 px-3 py-1.5 text-white">Semua</button>
          <button type="button" data-filter-type="fuel" class="rounded-lg bg-white px-3 py-1.5 text-slate-700">BBM</button>
          <button type="button" data-filter-type="maintenance" class="rounded-lg bg-white px-3 py-1.5 text-slate-700">Servis</button>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-2.5">
        <input
          id="logbook-search"
          type="search"
          placeholder="Cari SPBU, oli, catatan..."
          class="w-full rounded-xl border border-slate-300 px-3.5 py-2 text-sm sm:w-60"
        />
        <button id="btn-export-csv" type="button" class="rounded-xl border border-slate-200 bg-white px-3.5 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-50">
          Ekspor CSV
        </button>
      </div>
    </section>

    <!-- Unified Log Table -->
    <section class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-xs">
      <div class="flex items-center justify-between border-b border-slate-100 px-4 py-3.5">
        <h1 class="text-sm font-bold text-slate-900">Seluruh Catatan Kendaraan</h1>
        <span id="logbook-count" class="text-xs font-medium text-slate-500">0 catatan</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-slate-200 bg-slate-50/70 text-[11px] font-semibold uppercase tracking-wider text-slate-500">
              <th class="px-4 py-3">Tanggal &amp; Odo</th>
              <th class="px-4 py-3">Tipe</th>
              <th class="px-4 py-3">Deskripsi</th>
              <th class="px-4 py-3 text-right">Biaya</th>
              <th class="px-4 py-3 text-right">Aksi</th>
            </tr>
          </thead>
          <tbody id="logbook-table-body">
            <tr>
              <td colspan="5" class="px-4 py-10 text-center text-sm text-slate-500">Memuat catatan...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Modal: Edit Catatan BBM -->
  <div id="modal-edit-fuel" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/50 p-4">
    <div class="w-full max-w-md rounded-2xl bg-white p-6 shadow-xl">
      <div class="flex items-center justify-between">
        <h2 class="text-base font-bold text-slate-900">Edit Catatan BBM</h2>
        <button type="button" data-close-modal="modal-edit-fuel" class="text-sm text-slate-400 hover:text-slate-700">&times;</button>
      </div>
      <p data-modal-error class="mt-3 hidden rounded-xl bg-rose-50 px-3 py-2 text-xs text-rose-700"></p>
      <p data-odo-warning class="mt-3 hidden rounded-xl border border-amber-200 bg-amber-50 px-3 py-2 text-xs font-medium text-amber-800"></p>
      <form id="form-edit-fuel" class="mt-4 space-y-3.5">
        <input id="edit-fuel-id" name="id" type="hidden" />
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700">Tanggal *</label>
            <input id="edit-fuel-date" name="logged_at" type="date" required class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700">Odometer (km) *</label>
            <input id="edit-fuel-odometer" name="odometer_km" type="number" step="0.1" required class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700">Jenis BBM *</label>
          <select id="edit-fuel-brand" name="fuel_brand" required class="mt-1 w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm"></select>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700">Total Bayar (Rp) *</label>
            <input id="edit-fuel-total" name="total_cost" type="number" step="1" min="1" required class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700">Harga / Liter (Rp) *</label>
            <input id="edit-fuel-price" name="price_per_liter" type="number" step="1" min="1" required class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" />
          </div>
        </div>

        <div class="flex items-center justify-between rounded-xl border border-sky-200 bg-sky-50 px-3.5 py-2.5">
          <div>
            <p class="text-xs font-semibold text-sky-800">Volume Terhitung Otomatis</p>
            <p class="text-[11px] text-slate-500">Total Bayar &divide; Harga / Liter</p>
          </div>
          <p id="edit-fuel-liters-preview" class="text-base font-bold text-sky-700">0,00 L</p>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700">Lokasi SPBU</label>
          <input id="edit-fuel-station" name="station_name" type="text" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700">Catatan</label>
          <input id="edit-fuel-notes" name="notes" type="text" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" />
        </div>

        <label class="flex items-center gap-2 text-xs font-medium text-slate-700">
          <input id="edit-fuel-full-tank" name="is_full_tank" type="checkbox" class="h-4 w-4 rounded border-slate-300 text-sky-600" />
          Pengisian penuh (Full Tank) untuk hitung konsumsi km/L
        </label>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" data-close-modal="modal-edit-fuel" class="rounded-xl border border-slate-200 px-4 py-2 text-xs font-semibold text-slate-600">Batal</button>
          <button id="btn-submit-edit-fuel" type="submit" data-loading-text="Menyimpan..." class="rounded-xl bg-sky-600 px-4 py-2 text-xs font-semibold text-white">Simpan Perubahan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Edit Catatan Servis -->
  <div id="modal-edit-maint" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/50 p-4">
    <div class="w-full max-w-md rounded-2xl bg-white p-6 shadow-xl">
      <div class="flex items-center justify-between">
        <h2 class="text-base font-bold text-slate-900">Edit Catatan Servis</h2>
        <button type="button" data-close-modal="modal-edit-maint" class="text-sm text-slate-400 hover:text-slate-700">&times;</button>
      </div>
      <p data-modal-error class="mt-3 hidden rounded-xl bg-rose-50 px-3 py-2 text-xs text-rose-700"></p>
      <p data-odo-warning class="mt-3 hidden rounded-xl border border-amber-200 bg-amber-50 px-3 py-2 text-xs font-medium text-amber-800"></p>
      <form id="form-edit-maint" class="mt-4 space-y-3.5">
        <input id="edit-maint-id" name="id" type="hidden" />
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700">Tanggal *</label>
            <input id="edit-maint-date" name="logged_at" type="date" required class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700">Odometer (km) *</label>
            <input id="edit-maint-odometer" name="odometer_km" type="number" step="0.1" required class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700">Kategori *</label>
          <select id="edit-maint-category" name="category" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-sm">
            <option value="oil_change">Ganti Oli Mesin / Gardan</option>
            <option value="cvt_belt">Servis CVT / V-Belt / Roller</option>
            <option value="tires">Ban &amp; Tekanan Angin</option>
            <option value="brakes">Kampas &amp; Minyak Rem</option>
            <option value="battery">Aki &amp; Kelistrikan</option>
            <option value="tune_up">Tune Up &amp; Injeksi</option>
            <option value="other">Lainnya</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700">Deskripsi Pekerjaan *</label>
          <input id="edit-maint-title" name="title" type="text" required class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700">Total Biaya (Rp) *</label>
            <input id="edit-maint-cost" name="total_cost" type="number" required class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700">Target Servis Berikutnya (km)</label>
            <input id="edit-maint-next-due" name="next_due_km" type="number" step="1" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700">Nama Bengkel</label>
          <input id="edit-maint-workshop" name="workshop_name" type="text" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700">Catatan</label>
          <input id="edit-maint-notes" name="notes" type="text" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" />
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" data-close-modal="modal-edit-maint" class="rounded-xl border border-slate-200 px-4 py-2 text-xs font-semibold text-slate-600">Batal</button>
          <button id="btn-submit-edit-maint" type="submit" data-loading-text="Menyimpan..." class="rounded-xl bg-slate-900 px-4 py-2 text-xs font-semibold text-white">Simpan Perubahan</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
