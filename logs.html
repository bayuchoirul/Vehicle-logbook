<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0284c7" />
  <title>Riwayat Log — Vehicle Logbook</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./css/output.css" />
</head>
<body class="min-h-full bg-slate-50 text-slate-900">
  <header class="sticky top-0 z-30 border-b border-slate-200 bg-white/95 backdrop-blur">
    <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-3 px-4 py-3 sm:px-6">
      <div class="flex items-center gap-3">
        <a href="./index.html" class="text-base font-bold tracking-tight text-slate-900">
          Vehicle Logbook
        </a>
        <nav class="flex items-center gap-1 rounded-xl bg-slate-100 p-1 text-xs font-semibold">
          <a href="./index.html" class="rounded-lg px-3 py-1.5 text-slate-600 hover:text-slate-900">
            Dashboard
          </a>
          <a href="./logs.html" class="rounded-lg bg-white px-3 py-1.5 text-slate-900 shadow-xs">
            Riwayat Log
          </a>
        </nav>
      </div>

      <div class="flex items-center gap-2.5">
        <span id="user-email" class="hidden text-xs text-slate-500 sm:inline"></span>
        <button
          type="button"
          id="btn-signout"
          class="rounded-xl border border-slate-200 bg-white px-3 py-1.5 text-xs font-semibold text-slate-700 hover:bg-slate-100"
        >
          Keluar
        </button>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-6xl space-y-6 px-4 py-6 sm:px-6">
    <section class="flex flex-col gap-3 rounded-2xl border border-slate-200 bg-white p-4 shadow-xs sm:flex-row sm:items-center sm:justify-between">
      <div class="flex flex-wrap items-center gap-2.5">
        <select
          id="logs-vehicle-selector"
          aria-label="Pilih kendaraan"
          class="rounded-xl border border-slate-300 bg-white px-3.5 py-2 text-sm font-semibold text-slate-900"
        >
          <option value="">Memuat kendaraan...</option>
        </select>

        <div class="flex rounded-xl bg-slate-100 p-1 text-xs font-semibold">
          <button type="button" id="tab-fuel" class="rounded-lg bg-white px-3 py-1.5 text-slate-900 shadow-xs">
            Log BBM (<span id="count-fuel">0</span>)
          </button>
          <button type="button" id="tab-maint" class="rounded-lg px-3 py-1.5 text-slate-600 hover:text-slate-900">
            Log Servis (<span id="count-maint">0</span>)
          </button>
        </div>
      </div>

      <input
        id="logs-search"
        type="search"
        placeholder="Cari SPBU, BBM, bengkel, judul..."
        class="w-full rounded-xl border border-slate-300 px-3.5 py-2 text-sm sm:w-64"
      />
    </section>

    <section id="panel-fuel-logs" class="rounded-2xl border border-slate-200 bg-white p-4 shadow-xs sm:p-5">
      <div id="fuel-logs-list" class="divide-y divide-slate-100"></div>
    </section>

    <section id="panel-maint-logs" class="hidden rounded-2xl border border-slate-200 bg-white p-4 shadow-xs sm:p-5">
      <div id="maint-logs-list" class="divide-y divide-slate-100"></div>
    </section>
  </main>

  <script type="module" src="./js/controllers/logbook-controller.js"></script>
</body>
</html>
